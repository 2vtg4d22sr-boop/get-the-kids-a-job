name: Daily Bailey + Morgan Job Scan

on:
  schedule:
    # GitHub cron is UTC. 13:30 UTC = 8:30 AM CDT.
    # During CST this runs at 7:30 AM; a timezone guard below keeps the effective
    # scan near 8:30 America/Chicago. Manual runs are always allowed.
    - cron: "30 13 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:

concurrency:
  group: daily-job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: https://zhzvibozwiquzuazxktp.supabase.co
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check openai
      - name: Check Chicago schedule
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(TZ=America/Chicago date +%H)
          if [ "$HOUR" != "08" ]; then
            echo "Not the 8 AM Chicago run; exiting successfully."
            echo "SKIP_SCAN=true" >> "$GITHUB_ENV"
          fi
      - name: Validate secrets
        if: env.SKIP_SCAN != 'true'
        run: |
          test -n "$OPENAI_API_KEY" || (echo "::error::Missing OPENAI_API_KEY repository secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY repository secret" && exit 1)
      - name: Run scan and sync
        if: env.SKIP_SCAN != 'true'
        run: python automation/job_scan.py
