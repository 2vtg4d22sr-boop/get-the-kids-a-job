<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get The Kids A Job</title><style>
:root{--bg:#dffff7;--blue:#1e3197;--gold:#fbb73e;--green:#38cc85;--coral:#e05b74;--white:#fff;--muted:#657985}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#17252e}header,.wrap{max-width:1180px;margin:auto;padding:26px 18px 12px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--blue)}h1{font-size:clamp(32px,5vw,52px);margin:5px 0;color:var(--blue)}.sub{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 20px}.tab{border:0;border-radius:999px;padding:11px 18px;font-weight:850;background:#fff;color:var(--blue);cursor:pointer}.tab.active{background:var(--blue);color:#fff}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border-radius:20px;padding:16px;box-shadow:0 5px 18px #1e319712}.stat b{display:block;font-size:27px;color:var(--blue)}.stat span{font-size:11px;font-weight:850;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 7px 24px #1e319716;display:flex;flex-direction:column;min-height:350px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.company{font-weight:900;color:var(--blue);font-size:18px}.pill{border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;background:#fff0ca}.applied{background:#bee8a1}.title{font-size:23px;font-weight:900;margin:13px 0 7px}.salary{font-size:21px;font-weight:900;color:var(--blue)}.meta{color:var(--muted);font-size:13px;margin:5px 0 12px}.why{line-height:1.45;font-size:14px}.actions{display:grid;gap:10px;margin-top:auto;padding-top:20px}.btn{text-align:center;text-decoration:none;border-radius:999px;padding:11px 14px;font-weight:900;font-size:13px}.direct{background:var(--blue);color:#fff}.posting{background:var(--green);color:var(--blue)}.careers{background:var(--gold);color:var(--blue)}.empty{background:#fff;border-radius:22px;padding:28px;text-align:center;color:var(--muted);grid-column:1/-1}.footer{text-align:center;color:var(--muted);font-size:12px;margin:22px 0 35px}@media(max-width:760px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div class="eyebrow">FAMILY JOB HUB</div><h1>GET THE KIDS A JOB</h1><div class="sub">Bailey + Morgan opportunities from the live daily job-scan database.</div></header><main class="wrap"><div class="toolbar"><button class="tab active" data-c="All">All Jobs</button><button class="tab" data-c="Bailey">Bailey</button><button class="tab" data-c="Morgan">Morgan</button></div><section class="summary"><div class="stat"><b id="total">—</b><span>ACTIVE JOBS</span></div><div class="stat"><b id="new">—</b><span>NEW</span></div><div class="stat"><b id="interested">—</b><span>INTERESTED</span></div><div class="stat"><b id="applied">—</b><span>APPLIED</span></div></section><div id="grid" class="grid"><div class="empty">Loading live jobs…</div></div><div class="footer">Live Supabase data · Read-only preview while secure tracking edits are being added.</div></main><script>
const SB="https://zhzvibozwiquzuazxktp.supabase.co",KEY="sb_publishable_JvvQzjGpRncE5G3SQU2J-g_jpZHr-RK";let jobs=[],candidate="All";const e=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const l=(u,t,c)=>u?'<a class="btn '+c+'" href="'+e(u)+'" target="_blank" rel="noopener">'+t+'</a>':"";
function render(){const x=jobs.filter(j=>candidate==="All"||j.candidate===candidate),active=x.filter(j=>!["closed","expired","rejected","passed"].includes(String(j.job_status||"").toLowerCase()));total.textContent=active.length;newEl.textContent=x.filter(j=>String(j.application_status||"").toLowerCase()==="new").length;interested.textContent=x.filter(j=>j.interested).length;applied.textContent=x.filter(j=>j.applied).length;if(!x.length){grid.innerHTML='<div class="empty">No jobs are currently in this view.</div>';return}grid.innerHTML=x.map(j=>'<article class="card"><div class="top"><div class="company">'+e(j.company)+'</div><div><span class="pill">'+e(j.priority||j.fit_level||"Match")+'</span>'+(j.applied?' <span class="pill applied">Applied</span>':'')+'</div></div><div class="title">'+e(j.job_title)+'</div><div class="salary">'+e(j.salary_display||"Salary not listed")+'</div><div class="meta">'+e([j.location,j.work_setting,j.employment_type].filter(Boolean).join(" · "))+'</div><div class="why">'+e(j.why_candidate_fits||j.high_level_job_info||"")+'</div><div class="actions">'+l(j.company_apply_url,"Apply Direct","direct")+l(j.job_site_url,"Job Posting","posting")+l(j.company_careers_url,"Company Careers","careers")+'</div></article>').join("")}
const total=document.getElementById("total"),newEl=document.getElementById("new"),interested=document.getElementById("interested"),applied=document.getElementById("applied"),grid=document.getElementById("grid");
async function load(){try{const cols="id,candidate,company,job_title,location,work_setting,employment_type,salary_display,priority,fit_level,job_status,application_status,date_found,last_verified,high_level_job_info,why_candidate_fits,company_apply_url,job_site_url,company_careers_url,interested,applied,interview,offer";const r=await fetch(SB+"/rest/v1/GETTHEKIDSAJOB?select="+cols+"&order=date_found.desc",{headers:{apikey:KEY}});if(!r.ok)throw Error("Database returned "+r.status);jobs=await r.json();render()}catch(err){grid.innerHTML='<div class="empty">Could not load the live database: '+e(err.message)+'</div>'}}document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");candidate=b.dataset.c;render()});load();
</script></body></html>
